<!doctype html><html lang="pt-BR"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="robots" content="noindex,nofollow"><title>Meus pedidos — NEXOUS</title><link rel="stylesheet" href="/pedidos.css"></head><body data-admin="false"><header><a class="logo" href="/">NEXOUS</a><a href="/">Voltar à loja</a></header><main><h1>Meus pedidos</h1><p class="muted">Acompanhe o pagamento, a preparação e a entrega das suas compras.</p><form id="login" class="card"><h2>Entre na sua conta</h2><label>E-mail<input id="email" type="email" autocomplete="username" required></label><label>Senha<input id="password" type="password" autocomplete="current-password" required></label><button class="primary" type="submit">Entrar</button><p><a href="/">Criar conta ou recuperar senha na loja</a></p></form><div id="account" class="toolbar" hidden><span id="identity"></span><button id="refresh">Atualizar pedidos</button><button id="logout">Sair</button></div><p id="message" role="status" aria-live="polite"></p><div id="filter" hidden><label>Buscar nos pedidos carregados<input id="search" type="search" placeholder="Nome, número do pedido ou produto"></label></div><section id="orders" aria-label="Lista de pedidos"></section><button id="more" hidden>Carregar mais pedidos</button><p class="muted">O acompanhamento é atualizado pela NEXOUS. O link da transportadora, quando disponível, mostra os eventos do transporte.</p></main><script type="module" src="/pedidos.js"></script></body></html>
