<!doctype html>
<html lang="pt-BR">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">

  <title>Pedido confirmado — NEXOUS</title>

  <style>
    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      min-height: 100vh;
      background: #080808;
      color: #eee;
      font-family: Arial, sans-serif;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 25px;
    }

    .box {
      width: 100%;
      max-width: 500px;
      background: #111;
      border: 1px solid #222;
      border-radius: 20px;
      padding: 35px 25px;
      text-align: center;
    }

    .logo {
      font-weight: 900;
      letter-spacing: 5px;
      margin-bottom: 40px;
    }

    .check {
      font-size: 55px;
      margin-bottom: 15px;
    }

    h1 {
      font-size: 32px;
      margin: 0 0 15px;
    }

    p {
      color: #999;
      line-height: 1.6;
    }

    .btn {
      display: block;
      margin-top: 30px;
      padding: 15px;
      background: #eee;
      color: #080808;
      text-decoration: none;
      border-radius: 10px;
      font-weight: bold;
    }
  </style>
</head>

<body>

  <div class="box">

    <div class="logo">NEXOUS</div>

    <div class="check">✓</div>

    <h1>Pedido recebido.</h1>

    <p>
      Seu pagamento foi processado e seu pedido foi recebido pela NEXOUS.
    </p>

    <p>
      Guarde as informações do pagamento para acompanhar sua compra.
    </p>

    <a href="/" class="btn">
      VOLTAR PARA A LOJA
    </a>

  </div>

</body>
</html>
