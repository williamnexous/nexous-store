<!doctype html><html lang="pt-BR"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>NEXOUS Admin</title><style>body{background:#090909;color:#eee;font-family:Arial;margin:0;padding:24px;max-width:900px;margin:auto}input,textarea,select,button{width:100%;padding:12px;margin:6px 0;background:#151515;color:#fff;border:1px solid #333;border-radius:9px}button{background:#eee;color:#111;font-weight:bold}.card{border:1px solid #292929;border-radius:14px;padding:16px;margin:14px 0}.hide{display:none}img{max-width:120px;border-radius:8px}</style></head><body><h1>NEXOUS / ADMIN</h1><section id="login"><input id="email" type="email" placeholder="E-mail"><input id="password" type="password" placeholder="Senha"><button id="loginBtn">ENTRAR</button><p id="loginMsg"></p></section><section id="app" class="hide"><button id="logout">SAIR</button><h2>Novo produto</h2><div id="newForm"></div><button id="create">ADICIONAR PRODUTO</button><h2>Produtos</h2><div id="list"></div></section><script type="module">
import{createClient}from'https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/+esm';const sb=createClient('__SUPABASE_URL__','__SUPABASE_ANON_KEY__');const fields=(p={})=>`<input data-f="name" placeholder="Nome" value="${p.name||''}"><textarea data-f="description" placeholder="Descrição">${p.description||''}</textarea><input data-f="price" type="number" step="0.01" placeholder="Preço" value="${p.price||''}"><select data-f="tag">${['NEW','DROP','HOT','LIMITED'].map(x=>`<option ${p.tag===x?'selected':''}>${x}</option>`)}</select><label><input data-f="active" type="checkbox" ${p.active!==false?'checked':''}> Ativo</label><input data-file type="file" accept="image/*">${p.image_url?`<img src="${p.image_url}">`:''}`;newForm.innerHTML=fields();
async function isAdmin(){const{data:{user}}=await sb.auth.getUser();if(!user)return false;const{data}=await sb.from('admins').select('user_id').eq('user_id',user.id).maybeSingle();return !!data}async function boot(){if(await isAdmin()){login.classList.add('hide');app.classList.remove('hide');load()}else{app.classList.add('hide');login.classList.remove('hide')}}loginBtn.onclick=async()=>{loginMsg.textContent='Entrando...';const{error}=await sb.auth.signInWithPassword({email:email.value,password:password.value});loginMsg.textContent=error?error.message:'';boot()};logout.onclick=async()=>{await sb.auth.signOut();boot()};async function upload(file){if(!file)return null;const ext=file.name.split('.').pop();const path=`${crypto.randomUUID()}.${ext}`;const{error}=await sb.storage.from('products').upload(path,file,{upsert:false});if(error)throw error;return sb.storage.from('products').getPublicUrl(path).data.publicUrl}function values(root){const o={};root.querySelectorAll('[data-f]').forEach(e=>o[e.dataset.f]=e.type==='checkbox'?e.checked:e.value);o.price=Number(o.price);return o}create.onclick=async()=>{try{const o=values(newForm),url=await upload(newForm.querySelector('[data-file]').files[0]);if(url)o.image_url=url;const{error}=await sb.from('products').insert(o);if(error)throw error;newForm.innerHTML=fields();load()}catch(e){alert(e.message)}};async function load(){const{data,error}=await sb.from('products').select('*').order('created_at',{ascending:false});if(error)return alert(error.message);list.innerHTML=data.map(p=>`<div class="card" data-id="${p.id}">${fields(p)}<button data-save>SALVAR</button><button data-del>EXCLUIR</button></div>`).join('');list.querySelectorAll('.card').forEach(c=>{c.querySelector('[data-save]').onclick=()=>save(c);c.querySelector('[data-del]').onclick=()=>del(c)})}async function save(c){try{const o=values(c),url=await upload(c.querySelector('[data-file]').files[0]);if(url)o.image_url=url;const{error}=await sb.from('products').update(o).eq('id',c.dataset.id);if(error)throw error;load()}catch(e){alert(e.message)}}async function del(c){if(confirm('Excluir produto?')){const{error}=await sb.from('products').delete().eq('id',c.dataset.id);if(error)alert(error.message);else load()}}boot();</script></body></html>
