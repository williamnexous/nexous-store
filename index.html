<!doctype html><html lang="pt-BR"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>NEXOUS — Your Style.</title><style>*{box-sizing:border-box}body{margin:0;background:#080808;color:#eee;font-family:Arial,sans-serif}header{padding:22px 5%;display:flex;justify-content:space-between;border-bottom:1px solid #222;position:sticky;top:0;background:#080808dd;backdrop-filter:blur(12px);z-index:3}.logo{font-weight:900;letter-spacing:5px}.hero{padding:90px 5%;background:linear-gradient(120deg,#111,#050505);border-bottom:1px solid #222}.hero h1{font-size:clamp(52px,12vw,130px);margin:0;line-height:.85}.hero p{color:#888}.grid{padding:40px 5%;display:grid;grid-template-columns:repeat(auto-fit,minmax(230px,1fr));gap:20px}.card{background:#111;border:1px solid #222;border-radius:18px;overflow:hidden}.photo{aspect-ratio:1;background:#171717;display:grid;place-items:center;color:#555}.photo img{width:100%;height:100%;object-fit:cover}.info{padding:18px}.tag{font-size:11px;border:1px solid #555;padding:5px 8px;border-radius:99px}.price{font-size:22px;font-weight:bold}.btn{border:0;background:#eee;color:#080808;padding:12px 15px;border-radius:10px;font-weight:bold;cursor:pointer;width:100%}#cart{position:fixed;right:15px;bottom:15px;background:#eee;color:#111;border:0;border-radius:99px;padding:15px 20px;font-weight:bold;z-index:4}.drawer{display:none;position:fixed;inset:0;background:#000b;z-index:5}.panel{margin-left:auto;width:min(430px,100%);height:100%;background:#101010;padding:24px;overflow:auto}.row{display:flex;justify-content:space-between;gap:12px;margin:12px 0}.field{width:100%;padding:12px;background:#171717;color:#fff;border:1px solid #333;border-radius:9px}</style></head><body><header><div class="logo">NEXOUS</div><div>STREETWEAR / US</div></header><section class="hero"><h1>O ESTILO<br>COMEÇA AQUI.</h1><p>Crie sua própia tendência.</p></section><main id="products" class="grid"></main><button id="cart">CARRINHO (0)</button><div id="drawer" class="drawer"><div class="panel"><div class="row"><h2>Seu carrinho</h2><button onclick="closeCart()">✕</button></div><div id="cartItems"></div><h3 id="total"></h3><input id="name" class="field" placeholder="Seu nome">

<input id="email" class="field" type="email" placeholder="Seu e-mail">

<input
  id="cpf"
  class="field"
  inputmode="numeric"
  maxlength="14"
  autocomplete="off"
  placeholder="CPF"
>

<button class="btn" onclick="checkout()">
  PAGAR COM PIX
</button><p id="msg"></p></div></div><script type="module">
import{createClient}from'https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/+esm';
const CONFIG={url:'https://tcszjspirwwxrkabhtgi.supabase.co',anon:'sb_publishable_bZIkwmhElVzFMsGbk0bBgw_eFVWJuXV'};const sb=createClient(CONFIG.url,CONFIG.anon);let products=[],cart=JSON.parse(localStorage.nexousCart||'[]').filter(i=>i.size);
const money=n=>Number(n).toLocaleString('pt-BR',{style:'currency',currency:'BRL'});function save(){localStorage.nexousCart=JSON.stringify(cart);document.querySelector('#cart').textContent=`CARRINHO (${cart.reduce((a,b)=>a+b.quantity,0)})`}
async function load(){const{data,error}=await sb.from('products').select('*').eq('active',true).order('created_at',{ascending:false});if(error){
document.querySelector('#products').innerHTML='<p>ERRO SUPABASE: '+error.message+'</p>';
console.error(error);
return;
}products=data;document.querySelector('#products').innerHTML=data.map(p=>`<article class="card"><div class="photo">${p.image_url?`<img src="${p.image_url}" alt="">`:'NEXOUS'}</div><div class="info"><span class="tag">${p.tag||'DROP'}</span>

<h3>${p.name}</h3>

${p.variant ? `
  <p style="color:#bbb;font-weight:bold;margin:6px 0">
    ${p.product_type === 'tenis' ? 'Modelo' : 'Cor'}: ${p.variant}
  </p>
` : ''}

<p>${p.description||''}</p>

<p class="price">${money(p.price)}</p>

${p.product_type === 'tenis' ? `
  <select id="size-${p.id}" class="field" style="margin-bottom:10px">
    <option value="">Escolha o número</option>
    <option value="38">38</option>
    <option value="39">39</option>
    <option value="40">40</option>
    <option value="41">41</option>
    <option value="42">42</option>
  </select>
` : `
  <select id="size-${p.id}" class="field" style="margin-bottom:10px">
    <option value="">Escolha o tamanho</option>
    <option value="P">P</option>
    <option value="M">M</option>
    <option value="G">G</option>
  </select>
`}

<button class="btn" data-add="${p.id}">ADICIONAR</button></div></article>`).join('');document.querySelectorAll('[data-add]').forEach(b=>b.onclick=()=>add(b.dataset.add))}
function add(id){
  const sizeSelect = document.querySelector(`#size-${id}`);
  const size = sizeSelect?.value;

  if(!size){
    alert('Escolha o tamanho ou número antes de adicionar.');
    return;
  }

  const x = cart.find(i =>
    i.id === id && i.size === size
  );

  if(x){
    x.quantity++;
  }else{
    cart.push({
      id,
      size,
      quantity: 1
    });
  }

  save();
}

window.changeQty = (id, size, amount) => {
  const item = cart.find(i =>
    i.id === id && i.size === size
  );

  if(!item) return;

  item.quantity += amount;

  if(item.quantity <= 0){
    cart = cart.filter(i =>
      !(i.id === id && i.size === size)
    );
  }

  save();
  render();
};

window.removeItem = (id, size) => {
  cart = cart.filter(i =>
    !(i.id === id && i.size === size)
  );

  save();
  render();
};window.closeCart=()=>drawer.style.display='none';function render(){
  const rows = cart.map(i => {
    const p = products.find(x => x.id === i.id);

    return p ? `
      <div style="border-bottom:1px solid #222;padding:15px 0">

       <div class="row">
  <div>
    <strong>${p.name}</strong>
    <div style="color:#999;font-size:13px;margin-top:5px">
      ${p.product_type === 'tenis' ? 'Número' : 'Tamanho'}: ${i.size}
    </div>
  </div>

  <strong>${money(p.price * i.quantity)}</strong>
</div>

        <div style="display:flex;align-items:center;gap:10px;margin-top:10px">

        <button onclick="changeQty('${i.id}','${i.size}',-1)"
            style="padding:8px 12px;border:0;border-radius:7px;cursor:pointer">
            −
          </button>

          <strong>${i.quantity}</strong>

          <button onclick="changeQty('${i.id}','${i.size}',1)"
            style="padding:8px 12px;border:0;border-radius:7px;cursor:pointer">
            +
          </button>

          <button onclick="removeItem('${i.id}','${i.size}')"
            style="margin-left:auto;padding:8px 12px;border:1px solid #444;background:#171717;color:#eee;border-radius:7px;cursor:pointer">
            REMOVER
          </button>

        </div>
      </div>
    ` : '';
  }).join('');

  cartItems.innerHTML = rows || '<p>Carrinho vazio.</p>';

  total.textContent = 'Total: ' + money(
    cart.reduce((s,i) => {
      const p = products.find(x => x.id === i.id);
      return s + (p ? Number(p.price) * i.quantity : 0);
    },0)
  );}
document.querySelector('#cart').onclick=()=>{render();drawer.style.display='block'};window.checkout=async()=>{
    if(cart.length === 0){
    msg.textContent='Seu carrinho está vazio.';
    return;
  }
  msg.textContent='Criando pagamento...';

  const r=await fetch('/api/create-checkout',{
    method:'POST',
    headers:{
      'Content-Type':'application/json'
    },
    body:JSON.stringify({
      items:cart,
      customer: {
  name: document.querySelector('#name').value,
  email: document.querySelector('#email').value,
  cpf: document.querySelector('#cpf').value
}
    })
  });

  const d=await r.json();

  if(d.checkout_url){
    location.href=d.checkout_url;
  }else{
    msg.textContent=d.error||'Erro no checkout';
  }
};

save();
load();
</script>
</body>
</html>
