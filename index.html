<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">

<title>NEXOUS — Your Style.</title>

<style>
*{
  box-sizing:border-box;
}

body{
  margin:0;
  background:#080808;
  color:#eee;
  font-family:Arial,sans-serif;
}

header{
  padding:22px 5%;
  display:flex;
  justify-content:space-between;
  border-bottom:1px solid #222;
  position:sticky;
  top:0;
  background:#080808dd;
  backdrop-filter:blur(12px);
  z-index:3;
}

.logo{
  font-weight:900;
  letter-spacing:5px;
}

.hero{
  padding:90px 5%;
  background:linear-gradient(120deg,#111,#050505);
  border-bottom:1px solid #222;
}

.hero h1{
  font-size:clamp(52px,12vw,130px);
  margin:0;
  line-height:.85;
}

.hero p{
  color:#888;
}

.grid{
  padding:40px 5%;
  display:grid;
  grid-template-columns:repeat(auto-fit,minmax(230px,1fr));
  gap:20px;
}

.card{
  background:#111;
  border:1px solid #222;
  border-radius:18px;
  overflow:hidden;
}

.photo{
  aspect-ratio:1;
  background:#171717;
  display:grid;
  place-items:center;
  color:#555;
}

.photo img{
  width:100%;
  height:100%;
  object-fit:cover;
}

.info{
  padding:18px;
}

.tag{
  display:inline-block;
  font-size:11px;
  border:1px solid #555;
  padding:5px 8px;
  border-radius:99px;
}

.price{
  font-size:22px;
  font-weight:bold;
}

.stock{
  color:#888;
  font-size:13px;
}

.btn{
  border:0;
  background:#eee;
  color:#080808;
  padding:12px 15px;
  border-radius:10px;
  font-weight:bold;
  cursor:pointer;
  width:100%;
}

.btn:disabled{
  opacity:.45;
  cursor:not-allowed;
}

#cart{
  position:fixed;
  right:15px;
  bottom:15px;
  background:#eee;
  color:#111;
  border:0;
  border-radius:99px;
  padding:15px 20px;
  font-weight:bold;
  z-index:4;
}

.drawer{
  display:none;
  position:fixed;
  inset:0;
  background:#000b;
  z-index:5;
}

.panel{
  margin-left:auto;
  width:min(430px,100%);
  height:100%;
  background:#101010;
  padding:24px;
  overflow:auto;
}

.row{
  display:flex;
  justify-content:space-between;
  gap:12px;
  margin:12px 0;
}

.field{
  width:100%;
  padding:12px;
  background:#171717;
  color:#fff;
  border:1px solid #333;
  border-radius:9px;
  margin-bottom:10px;
}

.closeBtn{
  background:#171717;
  color:#fff;
  border:1px solid #333;
  border-radius:8px;
  padding:8px 12px;
  cursor:pointer;
}

.removeBtn{
  margin-left:auto;
  padding:8px 12px;
  border:1px solid #444;
  background:#171717;
  color:#eee;
  border-radius:7px;
  cursor:pointer;
}

.qtyBtn{
  padding:8px 12px;
  border:0;
  border-radius:7px;
  cursor:pointer;
}

#pixArea{
  display:none;
  margin-top:20px;
  text-align:center;
}

#pixQr{
  width:220px;
  max-width:100%;
  background:white;
  padding:10px;
  border-radius:12px;
  margin:10px auto;
}

#pixCode{
  height:100px;
  resize:none;
  margin:12px 0;
}

@media(max-width:600px){

  header{
    font-size:13px;
  }

  .hero{
    padding:65px 5%;
  }

  .grid{
    padding:25px 4%;
  }

  .panel{
    width:100%;
  }
}
</style>
</head>

<body>

<header>

<div class="logo">
NEXOUS
</div>

<div>
STREETWEAR / US
</div>

</header>


<section class="hero">

<h1>
O ESTILO<br>
COMEÇA AQUI.
</h1>

<p>
Crie sua própria tendência.
</p>

</section>


<main
id="products"
class="grid">
</main>


<button id="cart">
CARRINHO (0)
</button>


<div
id="drawer"
class="drawer">

<div class="panel">

<div class="row">

<h2>
Seu carrinho
</h2>

<button
class="closeBtn"
onclick="closeCart()">
✕
</button>

</div>


<div id="cartItems"></div>

<h3 id="total"></h3>


<h3>
Seus dados
</h3>

<input
id="name"
class="field"
placeholder="Seu nome">


<input
id="email"
class="field"
type="email"
placeholder="Seu e-mail">


<input
id="cpf"
class="field"
inputmode="numeric"
maxlength="14"
autocomplete="off"
placeholder="CPF">


<h3 style="margin-top:22px">
Endereço de entrega
</h3>


<input
id="cep"
class="field"
inputmode="numeric"
maxlength="9"
placeholder="CEP">


<input
id="rua"
class="field"
placeholder="Rua">


<input
id="numero"
class="field"
placeholder="Número">


<input
id="complemento"
class="field"
placeholder="Complemento (opcional)">


<input
id="bairro"
class="field"
placeholder="Bairro">


<input
id="cidade"
class="field"
placeholder="Cidade">


<input
id="estado"
class="field"
maxlength="2"
placeholder="Estado (ex: RS)">


<button
class="btn"
onclick="checkout()">

PAGAR COM PIX

</button>


<p id="msg"></p>


<div id="pixArea">

<h2>
Pagamento via Pix
</h2>

<p style="color:#aaa">
Escaneie o QR Code ou copie o código Pix.
</p>


<img
id="pixQr"
alt="QR Code Pix">


<textarea
id="pixCode"
class="field"
readonly>
</textarea>


<button
class="btn"
type="button"
onclick="copyPix()">

COPIAR CÓDIGO PIX

</button>


<p
id="pixStatus"
style="color:#aaa">

Aguardando pagamento...

</p>

</div>

</div>
</div>


<script type="module">

import {createClient}
from 'https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/+esm';


const CONFIG={

url:
'https://tcszjspirwwxrkabhtgi.supabase.co',

anon:
'sb_publishable_bZIkwmhElVzFMsGbk0bBgw_eFVWJuXV'

};


const sb=createClient(
CONFIG.url,
CONFIG.anon
);


let products=[];


let cart=
JSON.parse(
localStorage.nexousCart||'[]'
);


const money=n=>
Number(n||0).toLocaleString(
'pt-BR',
{
style:'currency',
currency:'BRL'
}
);


function save(){

localStorage.nexousCart=
JSON.stringify(cart);

document.querySelector('#cart')
.textContent=
`CARRINHO (${
cart.reduce(
(a,b)=>a+b.quantity,
0
)
})`;

}


function escapeHtml(value=''){

return String(value)

.replaceAll('&','&amp;')
.replaceAll('<','&lt;')
.replaceAll('>','&gt;')
.replaceAll('"','&quot;');

}


function getSizes(product){

/*
O seu banco possui a coluna "sizes".

Se ela estiver preenchida como ARRAY:
["38","39","40"]

usaremos diretamente.

Também deixei compatibilidade com "tamanhos"
caso você ainda tenha algum produto antigo.
*/

let sizes=
product.sizes ??
product.tamanhos ??
[];


if(Array.isArray(sizes)){

return sizes
.map(x=>String(x).trim())
.filter(Boolean);

}


/*
Se por algum motivo vier como texto:
"38,39,40"
*/

if(typeof sizes==='string'){

return sizes
.split(',')
.map(x=>x.trim())
.filter(Boolean);

}


return [];

}


function sizeLabel(product){

return product.product_type==='tenis'
?'número'
:'tamanho';

}


function sizeOptions(product){

const sizes=getSizes(product);


if(!sizes.length){

return `
<option value="">
Sem tamanhos disponíveis
</option>
`;

}


return `

<option value="">
Escolha o ${sizeLabel(product)}
</option>

${sizes.map(size=>`

<option value="${escapeHtml(size)}">
${escapeHtml(size)}
</option>

`).join('')}

`;

}


async function load(){

const {data,error}=
await sb
.from('products')
.select('*')
.eq('active',true)
.order(
'created_at',
{ascending:false}
);


if(error){

document.querySelector('#products')
.innerHTML=
`
<p>
ERRO SUPABASE:
${escapeHtml(error.message)}
</p>
`;

console.error(error);

return;

}


products=data||[];


renderProducts();

}


function renderProducts(){

const container=
document.querySelector('#products');


if(!products.length){

container.innerHTML=
'<p>Nenhum produto disponível.</p>';

return;

}


container.innerHTML=
products.map(p=>{

const sizes=getSizes(p);

const hasStock=
Number(p.stock ?? p.estoque ?? 0)>0;


return `

<article class="card">


<div class="photo">

${p.image_url

?`
<img
src="${escapeHtml(p.image_url)}"
alt="${escapeHtml(p.name||'Produto NEXOUS')}">
`

:'NEXOUS'

}

</div>


<div class="info">


<span class="tag">
${escapeHtml(p.tag||'DROP')}
</span>


<h3>
${escapeHtml(p.name||'Produto')}
</h3>


${p.variant
?`

<p
style="
color:#bbb;
font-weight:bold;
margin:6px 0;
">

${p.product_type==='tenis'
?'Modelo'
:'Cor'}:

${escapeHtml(p.variant)}

</p>

`
:''
}


<p>
${escapeHtml(p.description||'')}
</p>


<p class="price">
${money(p.price)}
</p>


<p class="stock">

${Number(p.stock ?? p.estoque ?? 0)}
em estoque

</p>


<select
id="size-${p.id}"
class="field"
${!sizes.length||!hasStock
?'disabled'
:''}>

${sizeOptions(p)}

</select>


<button
class="btn"
data-add="${p.id}"
${!sizes.length||!hasStock
?'disabled'
:''}>

${!hasStock
?'SEM ESTOQUE'
:'ADICIONAR'}

</button>


</div>

</article>

`;

}).join('');


document
.querySelectorAll('[data-add]')
.forEach(button=>{

button.onclick=
()=>add(button.dataset.add);

});

}


function add(id){

const product=
products.find(
p=>String(p.id)===String(id)
);


if(!product){

alert(
'Produto não encontrado.'
);

return;

}


const sizeSelect=
document.querySelector(
`#size-${id}`
);


const size=
sizeSelect?.value;


if(!size){

alert(
`Escolha o ${sizeLabel(product)} antes de adicionar.`
);

return;

}


const stock=
Number(
product.stock ??
product.estoque ??
0
);


const currentQuantity=
cart

.filter(i=>
String(i.id)===String(id)
)

.reduce(
(total,item)=>
total+item.quantity,
0
);


if(
currentQuantity>=stock
){

alert(
'Você atingiu o estoque disponível deste produto.'
);

return;

}


const existing=
cart.find(i=>

String(i.id)===String(id)
&&
i.size===size

);


if(existing){

existing.quantity++;

}else{

cart.push({

id:String(id),

size:size,

quantity:1

});

}


save();


alert(
'Produto adicionado ao carrinho!'
);

}


window.changeQty=
(id,size,amount)=>{


const item=
cart.find(i=>

String(i.id)===String(id)
&&
i.size===size

);


if(!item)return;


const product=
products.find(
p=>String(p.id)===String(id)
);


if(
amount>0 &&
product
){

const stock=
Number(
product.stock ??
product.estoque ??
0
);


const totalProductQuantity=
cart

.filter(i=>
String(i.id)===String(id)
)

.reduce(
(total,x)=>
total+x.quantity,
0
);


if(
totalProductQuantity>=stock
){

alert(
'Você atingiu o estoque disponível.'
);

return;

}

}


item.quantity+=amount;


if(item.quantity<=0){

cart=
cart.filter(i=>

!(
String(i.id)===String(id)
&&
i.size===size
)

);

}


save();

renderCart();

};


window.removeItem=
(id,size)=>{


cart=
cart.filter(i=>

!(
String(i.id)===String(id)
&&
i.size===size
)

);


save();

renderCart();

};


window.closeCart=()=>{

document.querySelector('#drawer')
.style.display='none';

};


function renderCart(){

const cartItems=
document.querySelector('#cartItems');


const rows=
cart.map(i=>{


const p=
products.find(
x=>String(x.id)===String(i.id)
);


if(!p)return '';


return `

<div
style="
border-bottom:1px solid #222;
padding:15px 0;
">


<div class="row">


<div>

<strong>
${escapeHtml(p.name)}
</strong>


<div
style="
color:#999;
font-size:13px;
margin-top:5px;
">

${p.product_type==='tenis'
?'Número'
:'Tamanho'}:

${escapeHtml(i.size)}

</div>

</div>


<strong>

${money(
Number(p.price)*
i.quantity
)}

</strong>


</div>


<div
style="
display:flex;
align-items:center;
gap:10px;
margin-top:10px;
">


<button
class="qtyBtn"
onclick=
"changeQty('${i.id}','${escapeHtml(i.size)}',-1)">

−

</button>


<strong>
${i.quantity}
</strong>


<button
class="qtyBtn"
onclick=
"changeQty('${i.id}','${escapeHtml(i.size)}',1)">

+

</button>


<button
class="removeBtn"
onclick=
"removeItem('${i.id}','${escapeHtml(i.size)}')">

REMOVER

</button>


</div>

</div>

`;

}).join('');


cartItems.innerHTML=
rows||
'<p>Carrinho vazio.</p>';


document.querySelector('#total')
.textContent=

'Total: ' +

money(

cart.reduce(

(sum,item)=>{

const p=
products.find(
x=>
String(x.id)===
String(item.id)
);


return sum+
(
p
?
Number(p.price)*
item.quantity
:
0
);

},

0

)

);

}


document
.querySelector('#cart')
.onclick=()=>{

renderCart();

document.querySelector('#drawer')
.style.display='block';

};


window.checkout=
async()=>{


const msg=
document.querySelector('#msg');


if(cart.length===0){

msg.textContent=
'Seu carrinho está vazio.';

return;

}


const customer={

name:
document
.querySelector('#name')
.value
.trim(),

email:
document
.querySelector('#email')
.value
.trim(),

cpf:
document
.querySelector('#cpf')
.value
.trim(),

cep:
document
.querySelector('#cep')
.value
.trim(),

rua:
document
.querySelector('#rua')
.value
.trim(),

numero:
document
.querySelector('#numero')
.value
.trim(),

complemento:
document
.querySelector('#complemento')
.value
.trim(),

bairro:
document
.querySelector('#bairro')
.value
.trim(),

cidade:
document
.querySelector('#cidade')
.value
.trim(),

estado:
document
.querySelector('#estado')
.value
.trim()
.toUpperCase()

};


if(
!customer.name||
!customer.email||
!customer.cpf||
!customer.cep||
!customer.rua||
!customer.numero||
!customer.bairro||
!customer.cidade||
!customer.estado
){

msg.textContent=
'Preencha todos os dados obrigatórios.';

return;

}


msg.textContent=
'Criando pagamento...';


try{


const response=
await fetch(
'/api/create-checkout',
{

method:'POST',

headers:{
'Content-Type':
'application/json'
},

body:
JSON.stringify({

items:cart,

customer

})

}
);


const data=
await response.json();


if(
data.qr_code &&
data.qr_code_base64
){

document
.querySelector('#pixArea')
.style.display='block';


document
.querySelector('#pixQr')
.src=

`data:image/png;base64,${data.qr_code_base64}`;


document
.querySelector('#pixCode')
.value=
data.qr_code;


document
.querySelector('#pixStatus')
.textContent=
'Aguardando pagamento...';


msg.textContent=
'Pix gerado com sucesso!';


}else{

msg.textContent=
data.error||
'Erro ao gerar Pix.';

}


}catch(error){

console.error(error);

msg.textContent=
'Erro ao conectar com o pagamento.';

}

};


window.copyPix=
async()=>{


const field=
document.querySelector(
'#pixCode'
);


const code=
field.value;


if(!code)return;


try{


await navigator
.clipboard
.writeText(code);


document
.querySelector('#pixStatus')
.textContent=
'Código Pix copiado!';


}catch{


field.select();

document.execCommand(
'copy'
);


document
.querySelector('#pixStatus')
.textContent=
'Código Pix copiado!';

}

};


save();

load();

</script>

</body>
</html>
